name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: ""
          - name: macOS
            os: macos-latest
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval.exe is a GUI-subsystem app, so PowerShell does not set
          # $LASTEXITCODE for it; wait for it and read the exit code directly.
          $p = Start-Process -FilePath ./pluginval/pluginval.exe -NoNewWindow -Wait -PassThru -ArgumentList @(
            '--strictness-level', '5', '--validate-in-process', '--skip-gui-tests',
            '--validate', 'build/OriginPsy_artefacts/Release/VST3/OriginPsy.vst3')
          Write-Host "pluginval exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: OriginPsy-${{ matrix.name }}
          path: |
            build/OriginPsy_artefacts/Release/VST3/
            build/OriginPsy_artefacts/Release/AU/
            build/OriginPsy_artefacts/Release/Standalone/
          if-no-files-found: error
